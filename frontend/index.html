<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vessel Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/assets/app.css">
  <style>.notice{color:#9a6500!important}</style>
</head>
<body>
  <main>
    <section class="search-panel">
      <span class="eyebrow">VESSEL TRACKING</span>
      <h1>Find a vessel</h1>
      <p class="intro">Enter a seven-digit IMO number to see the vessel information and latest available AIS position.</p>
      <form id="lookup-form">
        <label for="imo">IMO number</label>
        <div class="search-row">
          <input id="imo" name="imo" inputmode="numeric" pattern="[0-9]{7}" maxlength="7" placeholder="e.g. 9811000" required>
          <button type="submit">Search</button>
        </div>
      </form>
      <div id="message" role="status"></div>
      <article id="result" hidden></article>
    </section>
    <section id="map" aria-label="Vessel position map"></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/assets/app.js"></script>
</body>
</html>
