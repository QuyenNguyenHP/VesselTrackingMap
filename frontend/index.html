<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vessel Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/assets/app.css?v=20261025-2">
  <style>.notice{color:#9a6500!important}</style>
</head>
<body>
  <main>
    <section class="search-panel">
      <span class="eyebrow">VESSEL TRACKING</span>
      <h1>Find a vessel</h1>
      <p class="intro">Enter a 9-digit MMSI to look up a vessel in OpenWaters without an API key. Results depend on data coverage.</p>
      <form id="lookup-form">
        <label for="mmsi">MMSI</label>
        <div class="search-row">
          <input id="mmsi" name="mmsi" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" placeholder="9-digit MMSI" title="Enter a 9-digit MMSI" required>
          <button type="submit">Search</button>
        </div>
      </form>
      <section class="fleet-section" aria-labelledby="fleet-heading">
        <h2 id="fleet-heading">Monitored vessels <span id="fleet-count"></span></h2>
        <p id="fleet-status" role="status">Loading vessels...</p>
        <div id="vessel-list" aria-label="Choose a vessel"></div>
      </section>
      <div id="message" role="status"></div>
      <article id="result" hidden></article>
    </section>
    <section id="map" aria-label="Vessel position map"></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/assets/app.js?v=20261025-2"></script>
</body>
</html>
