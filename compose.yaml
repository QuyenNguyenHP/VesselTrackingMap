services:
  api:
    build: .
    restart: unless-stopped
    environment:
      CONFIG_PATH: /data/config.json
    volumes:
      - ./:/data
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
